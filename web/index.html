<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FALCON Sea Network</title>
<style>
  :root {
    --bg: #11161c; --panel: #172029; --line: #2b3742; --ink: #e6edf3; --dim: #8b9bab;
    --ocean: #0a1a26; --land: #27343f; --coast: #445a6b; --bad: #e8604c;
    --origin: #4ad4a0; --dest: #e8604c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; }
  .wrap { flex: 1; display: flex; min-height: 0; }
  aside { width: 340px; flex: none; padding: 14px 18px; border-right: 1px solid var(--line); overflow-y: auto; }
  label { display: block; margin: 12px 0 4px; font-size: 11.5px; letter-spacing: .04em;
          text-transform: uppercase; color: var(--dim); }
  input, select, button { width: 100%; padding: 7px 9px; background: var(--panel); color: var(--ink);
          border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1.6fr; gap: 0 10px; }
  button { margin-top: 14px; cursor: pointer; font-weight: 600; }
  button:hover { border-color: var(--origin); }
  .hint { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
  #msg { margin-top: 12px; font-size: 12.5px; color: var(--dim); }
  #msg.err { color: var(--bad); }
  ol { list-style: none; padding: 0; margin: 10px 0 0; }
  li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  li:hover, li.on { background: #1d2833; }
  li .top { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  li .sw { width: 22px; height: 4px; border-radius: 2px; flex: none; }
  li .delta { color: var(--dim); font-weight: 400; font-size: 12.5px; margin-left: auto; }
  li .via { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .map { flex: 1; position: relative; background: var(--ocean); min-width: 0; }
  svg { display: block; width: 100%; height: 100%; }
  .tools { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
  .tools button { width: auto; margin: 0; padding: 4px 10px; font-size: 12px; font-weight: 500;
                  background: rgba(17,22,28,.9); }
  .lbl { fill: var(--ink); paint-order: stroke; stroke: var(--bg); font-weight: 600; pointer-events: none; }
  @media (max-width: 760px) {
    .wrap { flex-direction: column; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--line); max-height: 45%; }
    .map { min-height: 55vh; }
  }
</style>
</head>
<body>
<header>
  <h1>FALCON Sea Network</h1>
  <p>Sea routes between any two of 3,806 ports, along real shipping lanes (Eurostat MARNET network).</p>
</header>
<div class="wrap">
  <aside>
    <label for="from">Origin port</label>
    <input id="from" list="ports" autocomplete="off" placeholder="Type a port name">
    <label for="to">Destination port</label>
    <input id="to" list="ports" autocomplete="off" placeholder="Type a port name">
    <datalist id="ports"></datalist>
    <div class="row">
      <div><label for="k">Routes (K)</label>
        <select id="k"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
      <div><label for="method">Method</label>
        <select id="method"><option value="yen">Yen's K shortest</option><option value="distinct">Distinct corridors</option></select></div>
    </div>
    <p class="hint" id="methodHint"></p>
    <button id="go">Find routes</button>
    <div id="msg"></div>
    <ol id="results"></ol>
  </aside>
  <div class="map">
    <svg id="svg" preserveAspectRatio="xMidYMid meet" aria-label="Map of sea routes">
      <rect id="ocean" fill="var(--ocean)"/>
      <g id="land"></g><g id="routes"></g><g id="marks"></g>
    </svg>
    <div class="tools"><button id="fit">Fit routes</button><button id="world">World</button></div>
  </div>
</div>

<script src="/vendor/d3-array.min.js"></script>
<script src="/vendor/d3-geo.min.js"></script>
<script src="/vendor/topojson-client.min.js"></script>
<script>
const W = 960, H = 480;
// Rotated so the Pacific sits in the middle; d3 handles lines that cross 180°.
const projection = d3.geoEquirectangular().rotate([-159, 0]).scale(W / (2 * Math.PI)).translate([W / 2, H / 2]);
const geoPath = d3.geoPath(projection);
const COLORS = ["#4ad4a0", "#e8b04c", "#c58bdd", "#4a9eda", "#f08a7c"];
const HINTS = {
  yen: "Exact next-shortest routes. On a mesh of shipping lanes these are often the same route shifted slightly, so lines can overlap.",
  distinct: "The shortest route through each separate corridor: alternatives at least 10% of the route length apart (50 nm minimum).",
};

const el = id => document.getElementById(id);
const svg = el("svg");
const svgEl = (tag, attrs) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

let byLabel = {}, byId = {}, lastRoutes = [], view = { x: 0, y: 0, w: W, h: H };

function setView(v) {
  // Match the svg's on-screen shape so a fitted area is not squashed.
  const r = svg.getBoundingClientRect(), ar = (r.width || W) / (r.height || H);
  let { x, y, w, h } = v;
  if (w / h < ar) { const nw = h * ar; x -= (nw - w) / 2; w = nw; }
  else { const nh = w / ar; y -= (nh - h) / 2; h = nh; }
  view = { x, y, w, h };
  svg.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
  const ocean = el("ocean");
  ocean.setAttribute("x", x - w); ocean.setAttribute("y", y - h);
  ocean.setAttribute("width", w * 3); ocean.setAttribute("height", h * 3);
  drawMarks();
}

function fitRoutes() {
  if (!lastRoutes.length) return setView({ x: 0, y: 0, w: W, h: H });
  const fc = { type: "FeatureCollection", features: lastRoutes.map(r =>
    ({ type: "Feature", geometry: { type: "LineString", coordinates: r.line } })) };
  const [[x0, y0], [x1, y1]] = geoPath.bounds(fc);
  const pad = Math.max(x1 - x0, y1 - y0) * 0.12 + 4;
  setView({ x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad });
}

function drawRoutes(highlight = null) {
  const g = el("routes"); g.innerHTML = "";
  // Draw the worst first so the best route sits on top.
  for (const r of [...lastRoutes].reverse()) {
    const on = highlight === null || highlight === r.rank;
    g.appendChild(svgEl("path", {
      d: geoPath({ type: "LineString", coordinates: r.line }), fill: "none",
      stroke: COLORS[r.rank - 1], "stroke-width": r.rank === 1 ? 4 : 2.6,
      "stroke-opacity": on ? 0.95 : 0.15, "stroke-linecap": "round", "stroke-linejoin": "round",
      "vector-effect": "non-scaling-stroke" }));
  }
}

function drawMarks() {
  const g = el("marks"); g.innerHTML = "";
  const s = view.w / W;      // keep markers the same size on screen at any zoom
  for (const [id, colour, role] of [[currentFrom, "var(--origin)", "Origin"], [currentTo, "var(--dest)", "Destination"]]) {
    const p = byId[id];
    if (!p) continue;
    const [x, y] = projection([p.lon, p.lat]);
    g.appendChild(svgEl("circle", { cx: x, cy: y, r: 6 * s, fill: colour, stroke: "var(--bg)",
                                     "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
    const t = svgEl("text", { x: x + 9 * s, y: y + 4 * s, class: "lbl", "font-size": 13 * s,
                               "stroke-width": 3 * s });
    t.textContent = `${role}: ${p.name}`;
    g.appendChild(t);
  }
}

let currentFrom = null, currentTo = null;

function renderResults(data) {
  const ol = el("results"); ol.innerHTML = "";
  const best = data.routes[0].length_nm;
  for (const r of data.routes) {
    const li = document.createElement("li");
    const delta = r.rank === 1 ? "shortest" : `+${(r.length_nm - best).toLocaleString(undefined, { maximumFractionDigits: 1 })} nm`;
    li.innerHTML = `<div class="top"><span class="sw" style="background:${COLORS[r.rank - 1]}"></span>
      #${r.rank} &nbsp;${Math.round(r.length_nm).toLocaleString()} nm<span class="delta">${delta}</span></div>
      <div class="via">${r.passages.length ? "via " + r.passages.join(", ") : "open ocean, no named strait"}</div>`;
    li.onmouseenter = () => { drawRoutes(r.rank); li.classList.add("on"); };
    li.onmouseleave = () => { drawRoutes(); li.classList.remove("on"); };
    ol.appendChild(li);
  }
}

async function go() {
  const msg = el("msg");
  currentFrom = byLabel[el("from").value]; currentTo = byLabel[el("to").value];
  if (!currentFrom || !currentTo) {
    msg.className = "err"; msg.textContent = "Pick both ports from the list.";
    return;
  }
  msg.className = ""; msg.textContent = "Routing...";
  const q = new URLSearchParams({ from: currentFrom, to: currentTo, k: el("k").value, method: el("method").value });
  const data = await (await fetch("/api/routes?" + q)).json();
  if (data.error) {
    msg.className = "err"; msg.textContent = data.error;
    lastRoutes = []; el("results").innerHTML = ""; drawRoutes(); drawMarks();
    return;
  }
  lastRoutes = data.routes;
  const n = data.routes.length;
  msg.textContent = `${n} route${n === 1 ? "" : "s"} in ${data.ms} ms` +
    (n < +el("k").value ? ` (no more ${data.method === "distinct" ? "distinct corridors" : "routes"} found)` : "");
  renderResults(data);
  drawRoutes();
  fitRoutes();
}

async function boot() {
  const topo = await (await fetch("/land-50m.json")).json();
  el("land").appendChild(svgEl("path", {
    d: geoPath(topojson.feature(topo, topo.objects.land)), fill: "var(--land)",
    stroke: "var(--coast)", "stroke-width": 0.7, "vector-effect": "non-scaling-stroke" }));

  const ports = await (await fetch("/api/ports")).json();
  const seen = {};
  for (const p of ports) {
    const base = p.country ? `${p.name}, ${p.country}` : p.name;
    seen[base] = (seen[base] || 0) + 1;
  }
  const list = el("ports");
  for (const p of ports) {
    const base = p.country ? `${p.name}, ${p.country}` : p.name;
    const label = seen[base] > 1 ? `${base} (${p.id})` : base;
    byLabel[label] = p.id; byId[p.id] = p;
    list.appendChild(new Option(label));
  }
  const labelOf = name => Object.keys(byLabel).find(l => byId[byLabel[l]].name === name);
  el("from").value = labelOf("Busan"); el("to").value = labelOf("Subic Bay");

  el("methodHint").textContent = HINTS[el("method").value];
  el("method").onchange = () => { el("methodHint").textContent = HINTS[el("method").value]; };
  el("go").onclick = go;
  for (const id of ["from", "to"]) el(id).addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  el("fit").onclick = fitRoutes;
  el("world").onclick = () => setView({ x: 0, y: 0, w: W, h: H });
  window.addEventListener("resize", () => setView(view));
  setView({ x: 0, y: 0, w: W, h: H });
  go();
}
boot();
</script>
</body>
</html>
