<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FALCON Sea Network</title>
<style>
  :root {
    --bg: #11161c; --panel: #172029; --line: #2b3742; --ink: #e6edf3; --dim: #8b9bab;
    --ocean: #0a1a26; --land: #27343f; --coast: #445a6b; --bad: #e8604c; --deny: #e8604c;
    --origin: #4ad4a0; --dest: #e8604c; --orig-route: #9aa8b6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; }
  .wrap { flex: 1; display: flex; min-height: 0; }
  aside { width: 350px; flex: none; padding: 14px 18px; border-right: 1px solid var(--line); overflow-y: auto; }
  label, .sec { display: block; margin: 12px 0 4px; font-size: 11.5px; letter-spacing: .04em;
          text-transform: uppercase; color: var(--dim); }
  .sec { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  input, select, button { width: 100%; padding: 7px 9px; background: var(--panel); color: var(--ink);
          border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1.6fr; gap: 0 10px; }
  .tri { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  button { cursor: pointer; font-weight: 600; }
  button:hover { border-color: var(--origin); }
  button.go { margin-top: 14px; }
  button.armed { border-color: var(--deny); background: #35211f; color: #f3b4aa; }
  .tri button { font-weight: 500; font-size: 12.5px; padding: 6px 4px; }
  .hint { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
  .hint.draw { color: #f3b4aa; }
  #areaList { list-style: none; padding: 0; margin: 8px 0 0; }
  #areaList li { display: flex; align-items: center; gap: 8px; padding: 4px 8px; margin-bottom: 4px;
                 border: 1px solid #5a2c26; background: #2a1a18; border-radius: 5px; font-size: 12.5px; cursor: default; }
  #areaList li span { flex: 1; }
  #areaList li button { width: auto; padding: 0 7px; border: none; background: none; color: #f3b4aa; font-size: 15px; }
  #msg { margin-top: 12px; font-size: 12.5px; color: var(--dim); }
  #msg.err { color: var(--bad); }
  .summary { margin-top: 10px; padding: 9px 11px; border-radius: 6px; background: #1d2833; font-size: 13px; }
  .summary b { color: #fff; }
  .summary.blocked { background: #35211f; color: #f3b4aa; }
  .summary .orig { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  .dash { width: 22px; height: 0; border-top: 2px dashed var(--orig-route); flex: none; }
  #results { list-style: none; padding: 0; margin: 10px 0 0; }
  #results li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  #results li:hover, #results li.on { background: #1d2833; }
  .top { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .sw { width: 22px; height: 4px; border-radius: 2px; flex: none; }
  .delta { color: var(--dim); font-weight: 400; font-size: 12.5px; margin-left: auto; }
  .via { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .map { flex: 1; position: relative; background: var(--ocean); min-width: 0; }
  svg { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  svg.panning { cursor: grabbing; }
  svg.drawing { cursor: crosshair; }
  .tools { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
  .tools button { width: auto; padding: 4px 10px; font-size: 12px; font-weight: 500; background: rgba(17,22,28,.9); }
  .lbl { fill: var(--ink); paint-order: stroke; stroke: var(--bg); font-weight: 600; pointer-events: none; }
  @media (max-width: 760px) {
    .wrap { flex-direction: column; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--line); max-height: 48%; }
    .map { min-height: 52vh; }
  }
</style>
</head>
<body>
<header>
  <h1>FALCON Sea Network</h1>
  <p>Sea routes between any two of 3,806 ports along real shipping lanes. Draw areas of denial and the routes go around them.</p>
</header>
<div class="wrap">
  <aside>
    <label for="from">Origin port</label>
    <input id="from" list="ports" autocomplete="off" placeholder="Type a port name">
    <label for="to">Destination port</label>
    <input id="to" list="ports" autocomplete="off" placeholder="Type a port name">
    <datalist id="ports"></datalist>
    <div class="row">
      <div><label for="k">Routes (K)</label>
        <select id="k"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
      <div><label for="method">Method</label>
        <select id="method"><option value="yen">Yen's K shortest</option><option value="distinct" selected>Distinct corridors</option></select></div>
    </div>
    <p class="hint" id="methodHint"></p>
    <button class="go" id="go">Find routes</button>

    <div class="sec">Areas of denial</div>
    <div class="tri">
      <button id="drawCircle">Circle</button>
      <button id="drawPoly">Polygon</button>
      <button id="clearAreas">Clear all</button>
    </div>
    <p class="hint" id="drawHint">Draw a circle or polygon on the map. Every sea lane through it is closed and the routes go around it.</p>
    <ul id="areaList"></ul>

    <div id="msg"></div>
    <div id="summary"></div>
    <ol id="results"></ol>
  </aside>
  <div class="map">
    <svg id="svg" preserveAspectRatio="xMidYMid meet" aria-label="Map of sea routes">
      <rect id="ocean" fill="var(--ocean)"/>
      <g id="land"></g><g id="areas"></g><g id="routes"></g><g id="draft"></g><g id="marks"></g>
    </svg>
    <div class="tools"><button id="fit">Fit routes</button><button id="world">World</button></div>
  </div>
</div>

<script src="/vendor/d3-array.min.js"></script>
<script src="/vendor/d3-geo.min.js"></script>
<script src="/vendor/topojson-client.min.js"></script>
<script>
const W = 960, H = 480, NM_PER_RAD = 3440.069;
// Rotated so the Pacific sits in the middle; d3 handles lines that cross 180°.
const projection = d3.geoEquirectangular().rotate([-159, 0]).scale(W / (2 * Math.PI)).translate([W / 2, H / 2]);
const geoPath = d3.geoPath(projection);
const COLORS = ["#4ad4a0", "#e8b04c", "#c58bdd", "#4a9eda", "#f08a7c"];
const HINTS = {
  yen: "Exact next-shortest routes. On a mesh of shipping lanes these are often the same route shifted slightly, so lines can overlap.",
  distinct: "The shortest route through each separate corridor: alternatives at least 10% of the route length apart (50 nm minimum).",
};
const DRAW_HINTS = {
  circle: "Press on the map and drag out the circle. Esc cancels.",
  polygon: "Click to add corners. Double-click, press Enter or click the first corner to finish. Backspace removes the last corner; Esc cancels.",
};

const el = id => document.getElementById(id);
const svg = el("svg");
const svgEl = (tag, attrs) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};
const fmt = (n, d = 0) => n.toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });

let byLabel = {}, byId = {}, view = { x: 0, y: 0, w: W, h: H };
let currentFrom = null, currentTo = null, last = null;
let areas = [];           // [{type: "circle", center, radius_nm} | {type: "polygon", points}]
let mode = null, draft = null;

// ------------------------------------------------------------------ view
function setView(v) {
  // Match the svg's on-screen shape so the mapping from screen to map stays linear.
  const r = svg.getBoundingClientRect(), ar = (r.width || W) / (r.height || H);
  let { x, y, w, h } = v;
  if (w / h < ar) { const nw = h * ar; x -= (nw - w) / 2; w = nw; }
  else { const nh = w / ar; y -= (nh - h) / 2; h = nh; }
  view = { x, y, w, h };
  svg.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
  const o = el("ocean");
  o.setAttribute("x", x - w); o.setAttribute("y", y - h); o.setAttribute("width", w * 3); o.setAttribute("height", h * 3);
  drawMarks(); drawDraft();
}
const scale = () => view.w / W;          // map units per screen-sized unit at this zoom

function toMap(e) {
  const r = svg.getBoundingClientRect();
  return [view.x + (e.clientX - r.left) / r.width * view.w, view.y + (e.clientY - r.top) / r.height * view.h];
}
const toLonLat = e => projection.invert(toMap(e));
const nmBetween = (a, b) => d3.geoDistance(a, b) * NM_PER_RAD;

function fitRoutes() {
  const feats = [];
  if (last && last.original) feats.push(last.original.line);
  if (last && last.routes) for (const r of last.routes) feats.push(r.line);
  if (!feats.length) return setView({ x: 0, y: 0, w: W, h: H });
  const [[x0, y0], [x1, y1]] = geoPath.bounds({ type: "MultiLineString", coordinates: feats });
  const pad = Math.max(x1 - x0, y1 - y0) * 0.12 + 4;
  setView({ x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad });
}

// --------------------------------------------------------------- drawing
const polyD = pts => "M" + pts.map(p => projection(p).join(",")).join("L") + "Z";
const circleD = a => geoPath(d3.geoCircle().center(a.center).radius(a.radius_nm / 60).precision(2)());

function drawAreas() {
  const g = el("areas"); g.innerHTML = "";
  for (const a of areas) {
    // Polygon sides are straight in longitude/latitude (as the server tests
    // them), which on this map means straight on screen: no geodesic curves.
    g.appendChild(svgEl("path", { d: a.type === "circle" ? circleD(a) : polyD(a.points),
      fill: "var(--deny)", "fill-opacity": .14, stroke: "var(--deny)", "stroke-width": 1.5,
      "stroke-dasharray": "6 4", "vector-effect": "non-scaling-stroke" }));
  }
  const list = el("areaList"); list.innerHTML = "";
  areas.forEach((a, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${a.type === "circle" ? `Circle, ${fmt(a.radius_nm)} nm radius` : `Polygon, ${a.points.length} corners`}</span>`;
    const x = document.createElement("button");
    x.title = "Remove this area"; x.textContent = "×";
    x.onclick = () => { areas.splice(i, 1); drawAreas(); go(); };
    li.appendChild(x); list.appendChild(li);
  });
}

function drawDraft() {
  const g = el("draft"); g.innerHTML = "";
  if (!draft) return;
  const s = scale();
  if (draft.type === "circle" && draft.radius_nm > 0) {
    g.appendChild(svgEl("path", { d: circleD(draft), fill: "var(--deny)", "fill-opacity": .1,
      stroke: "var(--deny)", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }));
    const [x, y] = projection(draft.center);
    const t = svgEl("text", { x: x + 8 * s, y: y - 8 * s, class: "lbl", "font-size": 12 * s, "stroke-width": 3 * s });
    t.textContent = `${fmt(draft.radius_nm)} nm`;
    g.appendChild(t);
  }
  if (draft.type === "polygon" && draft.points.length) {
    const pts = draft.hover ? [...draft.points, draft.hover] : draft.points;
    g.appendChild(svgEl("path", { d: "M" + pts.map(p => projection(p).join(",")).join("L"),
      fill: "none", stroke: "var(--deny)", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }));
    draft.points.forEach((p, i) => {
      const [x, y] = projection(p);
      g.appendChild(svgEl("circle", { cx: x, cy: y, r: (i === 0 ? 5 : 3.5) * s,
        fill: i === 0 ? "var(--deny)" : "var(--bg)", stroke: "var(--deny)", "stroke-width": 1.5,
        "vector-effect": "non-scaling-stroke" }));
    });
  }
}

function drawRoutes(highlight = null) {
  const g = el("routes"); g.innerHTML = "";
  if (!last) return;
  const showOriginal = areas.length && last.original && (last.affected || !last.routes.length);
  if (showOriginal) {
    g.appendChild(svgEl("path", { d: geoPath({ type: "LineString", coordinates: last.original.line }),
      fill: "none", stroke: "var(--orig-route)", "stroke-width": 2.4, "stroke-dasharray": "7 5",
      "stroke-opacity": highlight === null ? .85 : .3, "vector-effect": "non-scaling-stroke" }));
  }
  for (const r of [...last.routes].reverse()) {      // best on top
    const on = highlight === null || highlight === r.rank;
    g.appendChild(svgEl("path", { d: geoPath({ type: "LineString", coordinates: r.line }), fill: "none",
      stroke: COLORS[r.rank - 1], "stroke-width": r.rank === 1 ? 4 : 2.6, "stroke-opacity": on ? .95 : .15,
      "stroke-linecap": "round", "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }));
  }
}

function drawMarks() {
  const g = el("marks"); g.innerHTML = "";
  const s = scale();
  for (const [id, colour, role] of [[currentFrom, "var(--origin)", "Origin"], [currentTo, "var(--dest)", "Destination"]]) {
    const p = byId[id];
    if (!p) continue;
    const [x, y] = projection([p.lon, p.lat]);
    g.appendChild(svgEl("circle", { cx: x, cy: y, r: 6 * s, fill: colour, stroke: "var(--bg)",
                                     "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
    const t = svgEl("text", { x: x + 9 * s, y: y + 4 * s, class: "lbl", "font-size": 13 * s, "stroke-width": 3 * s });
    t.textContent = `${role}: ${p.name}`;
    g.appendChild(t);
  }
}

// -------------------------------------------------------------- results
function renderResults() {
  const ol = el("results"), sum = el("summary");
  ol.innerHTML = ""; sum.innerHTML = ""; sum.className = "";
  if (!last) return;
  if (areas.length) {
    sum.className = "summary" + (last.blocked ? " blocked" : "");
    const orig = `<div class="orig"><span class="dash"></span>Original route ${fmt(last.original.length_nm)} nm` +
                 (last.original.passages.length ? ` via ${last.original.passages.join(", ")}` : "") + "</div>";
    if (last.blocked) sum.innerHTML = `<b>${last.blocked}</b>${orig}`;
    else if (!last.affected) sum.innerHTML = `The ${areas.length === 1 ? "area closes" : "areas close"} ${fmt(last.closed_links)} links, but not the original route, which stays the best.`;
    else sum.innerHTML = `${areas.length === 1 ? "The area closes" : "The areas close"} ${fmt(last.closed_links)} links, including the original route. ` +
      `Best route now <b>${fmt(last.routes[0].length_nm)} nm</b>: <b>+${fmt(last.extra_nm)} nm</b>, about ${fmt(last.extra_days_at_18kt, 1)} more days at 18 knots.${orig}`;
  }
  const best = last.routes.length ? last.routes[0].length_nm : 0;
  for (const r of last.routes) {
    const li = document.createElement("li");
    const delta = r.rank === 1 ? "best" : `+${fmt(r.length_nm - best, 1)} nm`;
    li.innerHTML = `<div class="top"><span class="sw" style="background:${COLORS[r.rank - 1]}"></span>
      #${r.rank} &nbsp;${fmt(r.length_nm)} nm<span class="delta">${delta}</span></div>
      <div class="via">${r.passages.length ? "via " + r.passages.join(", ") : "open ocean, no named strait"}</div>`;
    li.onmouseenter = () => { drawRoutes(r.rank); li.classList.add("on"); };
    li.onmouseleave = () => { drawRoutes(); li.classList.remove("on"); };
    ol.appendChild(li);
  }
}

let pending = 0;
async function go(fit = false) {
  const msg = el("msg");
  currentFrom = byLabel[el("from").value]; currentTo = byLabel[el("to").value];
  drawMarks();
  if (!currentFrom || !currentTo) { msg.className = "err"; msg.textContent = "Pick both ports from the list."; return; }
  msg.className = ""; msg.textContent = "Routing...";
  const ticket = ++pending;
  const res = await fetch("/api/routes", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ from: currentFrom, to: currentTo, k: +el("k").value, method: el("method").value, areas }) });
  const data = await res.json();
  if (ticket !== pending) return;                 // a newer request has been sent since
  if (data.error) { msg.className = "err"; msg.textContent = data.error; last = null; renderResults(); drawRoutes(); return; }
  last = data;
  const n = data.routes.length;
  msg.textContent = data.blocked ? "" : `${n} route${n === 1 ? "" : "s"} in ${data.ms} ms` +
    (n < data.k ? ` (no more ${data.method === "distinct" ? "distinct corridors" : "routes"} found)` : "");
  renderResults(); drawRoutes();
  if (fit) fitRoutes();
}

// ---------------------------------------------------------- interaction
function setMode(m) {
  mode = m; draft = null; drawDraft();
  svg.classList.toggle("drawing", !!m);
  el("drawCircle").classList.toggle("armed", m === "circle");
  el("drawPoly").classList.toggle("armed", m === "polygon");
  el("drawHint").className = "hint" + (m ? " draw" : "");
  el("drawHint").textContent = m ? DRAW_HINTS[m]
    : "Draw a circle or polygon on the map. Every sea lane through it is closed and the routes go around it.";
}

function addArea(a) { areas.push(a); setMode(null); drawAreas(); go(); }

function finishPolygon() {
  if (draft && draft.points.length >= 3) addArea({ type: "polygon", points: draft.points });
  else setMode(null);
}

let pan = null;
svg.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  if (mode === "circle") {
    draft = { type: "circle", center: toLonLat(e), radius_nm: 0 };
    svg.setPointerCapture(e.pointerId);
  } else if (!mode) {
    pan = { x: e.clientX, y: e.clientY, view: { ...view } };
    svg.classList.add("panning"); svg.setPointerCapture(e.pointerId);
  }
});
svg.addEventListener("pointermove", e => {
  if (mode === "circle" && draft) { draft.radius_nm = nmBetween(draft.center, toLonLat(e)); drawDraft(); return; }
  if (mode === "polygon" && draft) { draft.hover = toLonLat(e); drawDraft(); return; }
  if (pan) {
    const r = svg.getBoundingClientRect();
    view = { ...pan.view, x: pan.view.x - (e.clientX - pan.x) / r.width * pan.view.w,
                          y: pan.view.y - (e.clientY - pan.y) / r.height * pan.view.h };
    setView(view);
  }
});
svg.addEventListener("pointerup", e => {
  if (mode === "circle" && draft) {
    if (draft.radius_nm >= 1) addArea({ type: "circle", center: draft.center, radius_nm: Math.round(draft.radius_nm) });
    else { draft = null; drawDraft(); }
    return;
  }
  pan = null; svg.classList.remove("panning");
});
svg.addEventListener("click", e => {
  if (mode !== "polygon") return;
  const p = toLonLat(e);
  draft = draft || { type: "polygon", points: [] };
  if (draft.points.length >= 3) {
    // Clicking near the first corner closes the shape.
    const [fx, fy] = projection(draft.points[0]), [mx, my] = toMap(e);
    if (Math.hypot(fx - mx, fy - my) < 9 * scale()) return finishPolygon();
  }
  draft.points.push(p); drawDraft();
});
svg.addEventListener("dblclick", e => {
  if (mode !== "polygon" || !draft) return;
  e.preventDefault();
  draft.points.pop();                 // the dblclick's second click added a duplicate corner
  finishPolygon();
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const [mx, my] = toMap(e), f = e.deltaY < 0 ? 0.8 : 1.25;
  const w = Math.min(W * 1.2, Math.max(W / 60, view.w * f)), k = w / view.w;
  setView({ x: mx - (mx - view.x) * k, y: my - (my - view.y) * k, w, h: view.h * k });
}, { passive: false });
window.addEventListener("keydown", e => {
  if (!mode || /^(INPUT|SELECT)$/.test(document.activeElement.tagName)) return;
  if (e.key === "Escape") setMode(null);
  else if (e.key === "Enter" && mode === "polygon") finishPolygon();
  else if (e.key === "Backspace" && mode === "polygon" && draft) { draft.points.pop(); drawDraft(); }
});

async function boot() {
  const topo = await (await fetch("/land-50m.json")).json();
  el("land").appendChild(svgEl("path", { d: geoPath(topojson.feature(topo, topo.objects.land)), fill: "var(--land)",
    stroke: "var(--coast)", "stroke-width": 0.7, "vector-effect": "non-scaling-stroke" }));

  const ports = await (await fetch("/api/ports")).json();
  const count = {};
  for (const p of ports) { const b = p.country ? `${p.name}, ${p.country}` : p.name; count[b] = (count[b] || 0) + 1; }
  const list = el("ports");
  for (const p of ports) {
    const base = p.country ? `${p.name}, ${p.country}` : p.name;
    const label = count[base] > 1 ? `${base} (${p.id})` : base;
    byLabel[label] = p.id; byId[p.id] = p;
    list.appendChild(new Option(label));
  }
  const labelOf = name => Object.keys(byLabel).find(l => byId[byLabel[l]].name === name);
  el("from").value = labelOf("Busan"); el("to").value = labelOf("Subic Bay");

  const hint = () => { el("methodHint").textContent = HINTS[el("method").value]; };
  hint();
  el("method").onchange = () => { hint(); go(); };
  el("k").onchange = () => go();
  el("go").onclick = () => go(true);
  for (const id of ["from", "to"]) el(id).addEventListener("keydown", e => { if (e.key === "Enter") go(true); });
  el("drawCircle").onclick = () => setMode(mode === "circle" ? null : "circle");
  el("drawPoly").onclick = () => setMode(mode === "polygon" ? null : "polygon");
  el("clearAreas").onclick = () => { areas = []; setMode(null); drawAreas(); go(); };
  el("fit").onclick = fitRoutes;
  el("world").onclick = () => setView({ x: 0, y: 0, w: W, h: H });
  window.addEventListener("resize", () => setView(view));
  setView({ x: 0, y: 0, w: W, h: H });
  go(true);
}
boot();
</script>
</body>
</html>
